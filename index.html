<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yashil Vodiy Residence · Concept</title>
<meta name="description" content="Concept website for a fictional residential complex in Tashkent: a scroll-driven 3D story by Akbarov Labs.">
<meta name="theme-color" content="#10221f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310221f'/%3E%3Cpath d='M16 4l2.4 6.8 7-2.7-3.2 6.2 6.5 4.4-7.7.3-3 4.6-.8 2.9v3.9h-1.6v-3.9l-.8-2.9-3-4.6-7.7-.3 6.5-4.4-3.2-6.2 7 2.7z' fill='%23e39a2d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght,SHRP@400..800,0..100&family=Golos+Text:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<a class="skip" href="#layouts" data-i18n="skip">Skip the 3D tour</a>

<header class="hdr" id="hdr">
  <a class="brand" href="#top" aria-label="Yashil Vodiy Residence">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M15.2 22.6h1.6V30h-1.6z" fill="currentColor"/><path d="M16 23c-3 0-5-1-6-2l-6 1 3.5-5L2 13l7-.5L7 6l6 3.5L16 2.5l3 7L25 6l-2 6.5 7 .5-5.5 4 3.5 5-6-1c-1 1-3 2-6 2z" fill="currentColor"/><path d="M16 27.6V10.6M16 21.4l6.6-6.3M16 21.4l-6.6-6.3M16 17l4.4-7.1M16 17l-4.4-7.1" fill="none" stroke="#10221f" stroke-width="1.1" stroke-linecap="round" opacity=".55"/></svg>
    <span class="wordmark">Yashil Vodiy<small data-i18n="brand.sub">Residence</small></span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="#story" data-jump="1" data-i18n="nav.location">Location</a>
    <a href="#story" data-jump="2" data-i18n="nav.construction">Construction</a>
    <a href="#layouts" data-i18n="nav.apartments">Apartments</a>
    <a href="#payment" data-i18n="nav.payment">Payment</a>
  </nav>
  <div class="hdr-right">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="uz">UZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="btn btn-cta" data-visit><span class="cta-full" data-i18n="cta.short">Book a visit</span><span class="cta-tiny" data-i18n="cta.tiny">Visit</span></button>
  </div>
  <i class="chbar" id="chbar" aria-hidden="true"></i>
</header>

<main id="top">
  <section class="story" id="story" aria-label="Yashil Vodiy Residence">
    <div class="stage" id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="poster" aria-hidden="true"></div>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="viewtag" id="viewTag" aria-hidden="true"></div>
      <div class="loader" id="loader" role="status"><span data-i18n="load">Loading the 3D tour</span><i></i></div>

      <div class="fallback-note" id="fbNote" hidden>
        <p id="fbText"></p>
        <button type="button" class="btn btn-light" id="fbBtn" data-i18n="fb.btn">Load the 3D tour</button>
      </div>

      <div class="cards">
        <article class="card is-active" data-ch="0">
          <h1 data-i18n="ch1.title">A green valley in the city</h1>
          <p class="lede" data-i18n="ch1.text"></p>
          <p class="facts-row" data-i18n="hero.facts"></p>
          <div class="hero-actions">
            <button type="button" class="btn btn-cta" data-jump-t="40.2"><span data-i18n="hero.cta">Choose your floor</span></button>
            <button type="button" class="btn-link" data-visit data-i18n="cta.short">Book a visit</button>
          </div>
          <p class="meta" data-i18n="hero.meta">Concept project · Tashkent</p>
        </article>

        <article class="card" data-ch="1">
          <h2 data-i18n="ch2.title"></h2>
          <p class="lede" data-i18n="ch2.text"></p>
          <ul class="poilist">
            <li><b data-i18n="poi.metro"></b><span data-i18n="poi.metroT"></span></li>
            <li><b data-i18n="poi.school"></b><span data-i18n="poi.schoolT"></span></li>
            <li><b data-i18n="poi.park"></b><span data-i18n="poi.parkT"></span></li>
            <li><b data-i18n="poi.mall"></b><span data-i18n="poi.mallT"></span></li>
          </ul>
        </article>

        <article class="card" data-ch="2">
          <h2 data-i18n="ch3.title"></h2>
          <p class="lede" data-i18n="ch3.text"></p>
          <div class="build">
            <div class="build-top"><strong id="bDate">Q3 2025</strong><span id="bStage"></span></div>
            <div class="build-bar"><i id="bFill"></i><s id="bPlan"></s><b id="bToday"><span data-i18n="build.today">Today</span></b></div>
            <p class="build-pct" id="bPct"></p>
          </div>
        </article>

        <article class="card" data-ch="3">
          <h2 data-i18n="ch4.title"></h2>
          <p class="lede" data-i18n="ch4.text"></p>
        </article>

        <article class="card card-wide" data-ch="4">
          <h2 data-i18n="ch5.title"></h2>
          <p class="lede" data-i18n="ch5.text"></p>
          <div class="floorpick">
            <div class="fp-head">
              <button type="button" class="fp-step" id="fpDown" data-i18n-aria="fp.down">−</button>
              <div class="fp-floor"><span class="fp-label" data-i18n="fp.floor">Floor</span><strong id="fpNum">9</strong><span class="fp-of" id="fpOf"></span></div>
              <button type="button" class="fp-step" id="fpUp" data-i18n-aria="fp.up">+</button>
            </div>
            <p class="fp-meta" id="fpMeta"></p>
            <button type="button" class="fp-more" id="fpMore" aria-controls="fpFlats"></button>
            <ul class="fp-flats" id="fpFlats" aria-label="Flats on this floor"></ul>
            <p class="fp-sel" id="fpSel" aria-live="polite"></p>
            <button type="button" class="btn btn-light fp-go" id="fpGo"><span></span> <span aria-hidden="true">↓</span></button>
            <p class="fp-hint" data-i18n="fp.hint"></p>
          </div>
        </article>

        <article class="card" data-ch="5">
          <h2 data-i18n="ch6.title"></h2>
          <p class="lede" data-i18n="ch6.text"></p>
          <p class="apt-status" id="aptStatus"></p>
        </article>

        <article class="card" data-ch="6">
          <h2 data-i18n="ch7.title"></h2>
          <p class="lede" data-i18n="ch7.text"></p>
          <div class="sun">
            <div class="sun-top"><label for="sunRange" data-i18n="sun.time">Time of day</label><strong id="sunClock">15:30</strong></div>
            <input type="range" id="sunRange" min="6" max="20" step="0.25" value="15.5">
            <div class="seg" role="group">
              <button type="button" data-season="0" data-i18n="sun.summer">Summer</button>
              <button type="button" data-season="1" data-i18n="sun.winter">Winter</button>
            </div>
            <p class="sun-hours" id="sunHours"></p>
          </div>
        </article>
      </div>

      <ol class="rail" id="rail" aria-label="Chapters">
        <li><button type="button"><span>01</span><em data-i18n="rail.home"></em></button></li>
        <li><button type="button"><span>02</span><em data-i18n="ch2.eyebrow"></em></button></li>
        <li><button type="button"><span>03</span><em data-i18n="ch3.eyebrow"></em></button></li>
        <li><button type="button"><span>04</span><em data-i18n="ch4.eyebrow"></em></button></li>
        <li><button type="button"><span>05</span><em data-i18n="ch5.eyebrow"></em></button></li>
        <li><button type="button"><span>06</span><em data-i18n="ch6.eyebrow"></em></button></li>
        <li><button type="button"><span>07</span><em data-i18n="ch7.eyebrow"></em></button></li>
      </ol>
      <div class="steps" id="steps" role="group" aria-label="Chapters"></div>
      <div class="hint" id="hint" aria-hidden="true"><span data-i18n="scroll"></span><i></i></div>
    </div>
  </section>

  <section class="sec layouts" id="layouts">
    <div class="wrap">
      <header class="sec-head">
        <h2 data-i18n="lay.title"></h2>
        <p data-i18n="lay.text"></p>
      </header>
      <div class="lay-grid" id="layGrid"></div>
    </div>
  </section>

  <section class="sec pay" id="payment">
    <div class="wrap pay-grid">
      <div class="pay-copy">
        <h2 data-i18n="pay.title"></h2>
        <p data-i18n="pay.text"></p>
        <div class="field">
          <span class="field-label" data-i18n="pay.layout"></span>
          <div class="chips" id="payLayout" role="group"></div>
        </div>
        <div class="field">
          <span class="field-label" id="payFloorLbl" data-i18n="pay.floor"></span>
          <div class="stepper" role="group" aria-labelledby="payFloorLbl">
            <button type="button" id="payFloorDown" data-i18n-aria="fp.down">−</button>
            <strong id="payFloorNum">9</strong>
            <button type="button" id="payFloorUp" data-i18n-aria="fp.up">+</button>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="payDown"><span data-i18n="pay.down"></span> <b id="payDownPct">40%</b></label>
          <input type="range" id="payDown" min="30" max="80" step="5" value="40">
        </div>
        <div class="field">
          <span class="field-label" data-i18n="pay.term"></span>
          <div class="chips" id="payTerm" role="group"></div>
        </div>
      </div>
      <div class="pay-card" aria-live="polite">
        <div class="pay-row"><span data-i18n="pay.price"></span><strong id="payPrice"></strong></div>
        <div class="pay-row"><span data-i18n="pay.first"></span><strong id="payFirst"></strong></div>
        <div class="pay-big"><span data-i18n="pay.monthly"></span><strong id="payMonthly"></strong><em id="payUsd"></em></div>
        <button type="button" class="btn btn-cta pay-reserve" id="payReserve" data-i18n="pay.reserve"></button>
        <p class="pay-note" data-i18n="pay.note"></p>
      </div>
    </div>
  </section>

  <section class="sec trust" id="trust">
    <div class="wrap trust-grid">
      <h2 data-i18n="trust.title"></h2>
      <dl class="trust-list">
        <div><dt data-i18n="trust.dev"></dt><dd data-i18n="trust.devT"></dd></div>
        <div><dt data-i18n="trust.permit"></dt><dd data-i18n="trust.permitT"></dd></div>
        <div><dt data-i18n="trust.money"></dt><dd data-i18n="trust.moneyT"></dd></div>
        <div><dt data-i18n="trust.keys"></dt><dd data-i18n="trust.keysT"></dd></div>
      </dl>
    </div>
  </section>

  <section class="sec end">
    <div class="wrap end-grid">
      <div class="end-copy">
        <h2 data-i18n="end.title"></h2>
        <p data-i18n="end.text"></p>
        <button type="button" class="btn btn-cta btn-lg" data-visit data-i18n="end.btn"></button>
      </div>
      <dl class="office">
        <div><dt data-i18n="end.office"></dt><dd data-i18n="end.addr"></dd></div>
        <div><dt data-i18n="bk.phone"></dt><dd><a href="tel:+998710000000">+998 71 000 00 00</a></dd></div>
        <div><dt data-i18n="end.hoursL"></dt><dd data-i18n="end.hours"></dd></div>
      </dl>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <p data-i18n="foot.concept"></p>
    <p><span data-i18n="foot.made"></span> <a href="https://akbarovlabs.uz" rel="noopener">Akbarov Labs</a> · <a href="https://github.com/akbarov-labs/yashil-vodiy" rel="noopener" data-i18n="foot.how"></a></p>
  </div>
</footer>

<dialog class="dlg" id="bk" aria-labelledby="bkTitle">
  <form class="bk-form" id="bkForm" novalidate>
    <p class="bk-demo" data-i18n="bk.demo"></p>
    <h3 id="bkTitle" data-i18n="bk.title"></h3>
    <label class="bk-field"><span data-i18n="bk.name"></span>
      <input type="text" name="name" id="bkName" autocomplete="name" maxlength="60" aria-describedby="bkNameErr">
      <em class="bk-err" id="bkNameErr"></em></label>
    <label class="bk-field"><span data-i18n="bk.phone"></span>
      <span class="bk-phone"><b>+998</b><input type="tel" name="phone" id="bkPhone" inputmode="numeric" autocomplete="tel-national" placeholder="90 123 45 67" aria-describedby="bkPhoneErr"></span>
      <em class="bk-err" id="bkPhoneErr"></em></label>
    <fieldset class="bk-field"><legend data-i18n="bk.via"></legend>
      <div class="bk-via">
        <label><input type="radio" name="via" value="call" checked><span data-i18n="bk.call"></span></label>
        <label><input type="radio" name="via" value="tg"><span data-i18n="bk.tg"></span></label>
        <label><input type="radio" name="via" value="wa"><span data-i18n="bk.wa"></span></label>
      </div></fieldset>
    <div class="bk-row">
      <label class="bk-field"><span data-i18n="bk.date"></span>
        <input type="date" name="date" id="bkDate" aria-describedby="bkDateErr">
        <em class="bk-err" id="bkDateErr"></em></label>
      <label class="bk-field"><span data-i18n="bk.flat"></span>
        <input type="text" name="flat" id="bkFlat" readonly></label>
    </div>
    <div class="dlg-actions">
      <button type="submit" class="btn btn-cta" data-i18n="bk.send"></button>
      <button type="button" class="btn btn-ghost" data-close data-i18n="bk.cancel"></button>
    </div>
  </form>
  <div class="bk-ok" id="bkOk" hidden>
    <p class="bk-demo" data-i18n="bk.demo"></p>
    <h3 data-i18n="bk.okTitle"></h3>
    <p id="bkOkText"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-cta" data-close data-i18n="bk.close"></button>
      <a class="btn btn-ghost" href="https://akbarovlabs.uz" rel="noopener" data-i18n="bk.link"></a>
    </div>
  </div>
</dialog>

<script type="module" src="js/page.js"></script>
</body>
</html>
